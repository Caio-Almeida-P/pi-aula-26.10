<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal IICAT - Cadastro de Usuário</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body>

    <div class="register-container">
        <!-- Logotipo -->
        <div class="logo-container">
            <img src="Logo IICAT.jpg" alt="Logo IICAT - Instituto Internacional de Carreiras Acadêmicas & Tecnológicas">
        </div>

        <!-- Formulário de Cadastro -->
        <form class="register-form">
            <h2>Criar Conta de Acesso</h2>

            <!-- Nome Completo -->
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <!-- E-mail -->
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <!-- Celular -->
            <div class="input-group">
                <label for="celular">Celular / WhatsApp</label>
                <input type="tel" id="celular" name="celular" placeholder="(11) 99999-9999" required>
            </div>

            <!-- Botão para Solicitar Código -->
            <button type="button" class="btn-submit" id="btn-codigo">Receber código de acesso</button>

            <!-- Caixa para Digitação do Código de Acesso (Abaixo do Celular/Botão) -->
            <div class="input-group code-group">
                <label for="codigo">Código de Acesso</label>
                <input type="text" id="codigo" name="codigo" placeholder="Digite o código recebido" maxlength="6">
            </div>

            <!-- Botão para Confirmar Cadastro -->
            <button type="submit" class="btn-confirm" id="btn-cadastrar">Concluir Cadastro</button>

            <!-- Link de Retorno ao Login -->
            <div class="options">
                <a href="login.html" class="login-link">Já tem uma conta? Faça Login</a>
            </div>
        </form>
    </div>

</body>
</html>
